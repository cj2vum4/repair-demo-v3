<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>報修登記</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">維護服務</p>
      <h1>報修登記</h1>
      <p>填寫遇到的問題，並在下方查看最近的報修紀錄。</p>
    </header>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>
      <noscript><p>請啟用 JavaScript 以使用報修登記。</p></noscript>
      <form id="repair-form">
        <fieldset id="repair-fields" disabled aria-labelledby="form-title">
          <div class="field">
            <label for="reporter-name">報修人</label>
            <input id="reporter-name" name="reporter_name" autocomplete="name" maxlength="100" required>
          </div>
          <div class="field">
            <label for="location">地點或部門</label>
            <input id="location" name="location" maxlength="200" required>
          </div>
          <div class="field">
            <label for="category">類別</label>
            <select id="category" name="category" required>
              <option value="" disabled selected>請選擇類別</option>
              <option>設備</option>
              <option>網路</option>
              <option>環境</option>
              <option>其他</option>
            </select>
          </div>
          <div class="field">
            <label for="urgency">緊急程度</label>
            <select id="urgency" name="urgency" required>
              <option>低</option>
              <option selected>中</option>
              <option>高</option>
            </select>
          </div>
          <div class="field full-width">
            <label for="description">問題說明</label>
            <textarea id="description" name="description" rows="4" maxlength="2000" required></textarea>
          </div>
          <div class="field">
            <label for="assignee">負責人</label>
            <input id="assignee" name="assignee" maxlength="100" required>
          </div>
          <div class="field">
            <label for="photo-url">照片網址（選填）</label>
            <input id="photo-url" name="photo_url" type="url" placeholder="https://example.com/photo.jpg" maxlength="2048">
          </div>
          <button id="submit-button" type="submit">送出報修</button>
        </fieldset>
        <p id="form-message" class="message" role="status"></p>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-title">
      <h2 id="list-title">最近報修</h2>
      <p class="section-note">最多顯示 20 筆，最新的在最上方。</p>
      <p id="list-message" class="message" role="status"></p>
      <ol id="request-list" class="request-list"></ol>
    </section>
  </main>
</body>
</html>
